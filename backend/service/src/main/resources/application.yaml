spring:
  application:
    name: wikmind
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
  ai:
    ollama:
      base-url: http://localhost:11434

      chat:
        options:
          model: mistral:7b
    embedding:
      options:
        model: text-embedding-3-large


