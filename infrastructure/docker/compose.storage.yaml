services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.05
    container_name: wikmind-storage
    restart: unless-stopped

    command:
      - mini
      - -dir=/data
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json

    ports:
      - "8333:8333"   # S3
      - "8888:8888"   # Filer UI
      - "9333:9333"   # Master UI
      - "23646:23646" # Admin UI

    volumes:
      - wikmind-storage-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  wikmind-storage-data: